global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "ticket4u-prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: "/metrics"

  - job_name: "ticket4u-springboot"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8081"]
    metrics_path: "/actuator/prometheus"

  - job_name: "ticket4u-node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "ticket4u-mysql-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["mysql-exporter:9104"]
    metrics_path: "/metrics"

  - job_name: "ticket4u-redis-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: ["redis-exporter:9121"]
    metrics_path: "/metrics"


