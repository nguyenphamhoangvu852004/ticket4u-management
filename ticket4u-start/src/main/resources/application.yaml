server:
  port: 8081
  # tomcat:
  #   threads:
  #     max: 10


spring:
  application:
    name: ticket4u-start
  datasource:
    url: jdbc:mysql://localhost:3307/vetautet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: defaultpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # Redis server connection settings
  data:
    redis:
      host: localhost
      port: 6380
      password: ""
      lettuce:
        pool:  # Coonection Pool setting
          max-active: 8  # Maximun number of active connections in the pool (uses -1 for no limit)
          max-idle: 8 # Maximum number of idle connections in the pool
          min-idle: 0 # Minimum number of idle connections in the pool
          max-wait: -1ms # Maximum wat time to get a connection from the pool (uses -1 for no limt)
      connect-timeout: 30000

resilience4j:
  circuitbreaker:
    instances:
      checkRandom:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
#        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 20
        waitDurationInOpenState: 50s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

  ratelimiter:
    instances:
      backendA:
        limitForPeriod: 2 # maximum 2 request per second
        limitRefreshPeriod: 10s
        timeoutDuration: 0 # thoi gian cho request toi da neu he thong da dat gioi han requrest
        registerHealthIndicator: true
        eventConsumerBufferSize: 100
      backendB:
        limitForPeriod: 5
        limitRefreshPeriod: 500ms
        timeoutDuration: 3s

management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include:
          - '*'
